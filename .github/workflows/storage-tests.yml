name: Scannity storage tests

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "storage.js"
      - "tests/**"
      - ".github/workflows/storage-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "storage.js"
      - "tests/**"
      - ".github/workflows/storage-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check storage.js
          node --check tests/storage.test.cjs
      - name: Test local persistence and migration
        run: node tests/storage.test.cjs
